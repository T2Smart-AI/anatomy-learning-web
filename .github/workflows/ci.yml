name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repack pipeline is idempotent
        run: node tools/repack-by-system.mjs

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve and probe key files
        run: |
          python3 -m http.server 8080 &
          SERVER_PID=$!
          sleep 2
          fail=0
          for p in "/" "/src/app.js" "/src/viewer3d.js" "/src/anatomy-data.js" \
                   "/src/models/atlas.json" "/src/part-map.json" \
                   "/src/models/sys-skeletal.bin.gz" "/src/vendor/three.module.js"; do
            if curl -sf "http://localhost:8080$p" > /dev/null; then
              echo "OK   $p"
            else
              echo "FAIL $p"
              fail=1
            fi
          done
          kill $SERVER_PID
          exit $fail
